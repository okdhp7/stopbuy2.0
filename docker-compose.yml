services:
  agent:
    build:
      context: ./agent
    image: stopbuy2-agent:latest
    container_name: stopbuy2_agent
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 8765
      REGRET_THRESHOLD: ${REGRET_THRESHOLD:-0.4}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8765), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: stopbuy2-backend:latest
    container_name: stopbuy2_backend
    environment:
      AGENT_WS_URL: ws://agent:8765
      AGENT_TIMEOUT: 120
      LOG_LEVEL: INFO
    ports:
      - "8010:8000"
    depends_on:
      agent:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    image: stopbuy2-frontend:latest
    container_name: stopbuy2_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
